server:
  port: 8099
  # 允许局域网设备访问
  address: 0.0.0.0

# 外部模拟系统配置
external:
  simulation:
    base-url: ${EXTERNAL_SIM_BASE_URL:http://127.0.0.1:${server.port}}
    callback-base-url: ${EXTERNAL_SIM_CALLBACK_BASE_URL:http://127.0.0.1:${server.port}}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: port-pilotage-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.validation.ValidationAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.MetricsAutoConfiguration
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/port_pilotage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:2057516125@qq.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
#    time-zone: GMT+8
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 3000

  jpa:
    open-in-view: false
  data:
    redis:
      timeout: 3000
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: syy.portPilotage.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: 港口引航及计费系统API
  show-actuator: false
  use-management-port: false

security:
  jwt:
    secret: ${JWT_SECRET:shitiandi@2057516125shitiandi@2057516125}
    expiration-minutes: 240

api:
  amap:
    key: ${AMAP_KEY:}
    security: ${AMAP_SECURITY:}
  weather:
    api-key: ${WEATHER_API_KEY:}
    base-url: https://api.weather.com/
  ai:
    openai:
      apiKey: ${ANYTHINGLLM_API_KEY:}
      anythingllmUrl: ${ANYTHINGLLM_URL:}
      workspaceId: ${ANYTHINGLLM_WORKSPACE_ID:default}
      mode: chat

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    syy.portPilotage: INFO

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    url-prefix: /uploads/
    max-size: 10485760